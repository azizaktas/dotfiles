# Ana format (tek satır için line_break kaldırıldı)
format = """
[](#000000)\
$os\
$username\
$hostname\
[](bg:#FFFF00 fg:#000000)\
$directory\
[](fg:#FFFF00 bg:#0000FF)\
$git_branch\
$git_status\
[](fg:#0000FF bg:#00FF00)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
$python\
$rlang\
[](fg:#00FF00 bg:#800000)\
$docker_context\
[](fg:#800000 bg:#FF0000)\
$conda\
[ ](fg:#FF0000)\
$character
"""

# Tek satırlı kullanım için satır atlama devre dışı bırakıldı
[line_break]
disabled = true

# Tek satırlı komut satırı sembolü
[character]
success_symbol = '[❯](bold #00FF00)'
error_symbol = '[❯](bold #FF0000)'
format = '$symbol '
disabled = false

[username]
show_always = true
style_user = 'bg:#000000 fg:#FFFFFF bold'
style_root = 'bg:#000000 fg:#FF0000 bold'
format = '[$user ]($style)'
disabled = false

[hostname]
ssh_only = true
ssh_symbol = '🌐'
trim_at = '.'
style = 'bg:#000000 fg:#FFFFFF bold'
format = '[$ssh_symbol $hostname]($style)'
disabled = false

[os]
style = 'bg:#000000'
disabled = true

[directory]
style = 'bg:#FFFF00 fg:#000000 bold'
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[c]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[conda]
symbol = '🅒'
style = 'bg:#FF0000 fg:#FFFFFF bold'
format = '[ $symbol $environment ]($style)'
ignore_base = false

[docker_context]
symbol = ''
style = 'bg:#800000 fg:#FFFFFF bold'
format = '[ $symbol $context ]($style) $path'

[elixir]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ''
style = 'bg:#0000FF fg:#FFFFFF bold'
format = '[ $symbol $branch ]($style)'

[git_status]
style = 'bg:#0000FF fg:#FFFFFF bold'
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[python]
symbol = '🐍'
format = '[${symbol} ${pyenv_prefix} (${version} )(\($virtualenv\) )]($style)'
style = 'bg:#00FF00 fg:#000000 bold'

[rlang]
symbol = '📐'
style = 'bg:#00FF00 fg:#000000 bold'
format = '[$symbol ($version )]($style)'

[rust]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = ''
style = 'bg:#00FF00 fg:#000000 bold'
format = '[ $symbol ($version) ]($style)'

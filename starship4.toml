# Satır başı formatı
format = """
[](#800000)\
$username\
[](bg:#000080 fg:#800000)\
$directory\
[](fg:#000080 bg:#006400)\
$git_branch\
$git_status\
[](fg:#006400 bg:#000000)\
$c\
$golang\
$java\
$nodejs\
$rust\
$python\
[](fg:#000000 bg:#FFFF00)\
$cmd_duration\
[](fg:#FFFF00 bg:#FFFFFF)\
$time\
[ ](fg:#FFFFFF)\
$character
"""

# Kullanıcı Adı (Bordo arka plan, beyaz yazı)
[username]
show_always = true
style_user = "bg:#800000 fg:#FFFFFF bold"
style_root = "bg:#800000 fg:#FF0000 bold"
format = "[$user]($style)"

# Dizim / Klasör (Lacivert arka plan, sarı yazı)
[directory]
style = "bg:#000080 fg:#FFFF00 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Git Dalı (Koyu Yeşil arka plan, beyaz yazı)
[git_branch]
symbol = "🌿 "
style = "bg:#006400 fg:#FFFFFF bold"
format = "[ $symbol$branch ]($style)"

# Git Durumu (Koyu Yeşil arka plan, sarı/kırmızı simgeler)
[git_status]
style = "bg:#006400 fg:#FFFF00 bold"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "🚨"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "❓"
stashed = "📦"
modified = "📝"
staged = "[+${count}](bg:#006400 fg:#FFFFFF bold)"
renamed = "👅"
deleted = "🗑"

# Yazılım Dilleri & Araçlar (Siyah arka plan, canlı renkler)
[c]
symbol = "C "
style = "bg:#000000 fg:#FFFFFF bold"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = "Go "
style = "bg:#000000 fg:#FFFFFF bold"
format = "[ $symbol($version) ]($style)"

[java]
symbol = "Java "
style = "bg:#000000 fg:#FF0000 bold"
format = "[ $symbol($version) ]($style)"

[nodejs]
symbol = "Node "
style = "bg:#000000 fg:#00FF00 bold"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = "Rust "
style = "bg:#000000 fg:#FF0000 bold"
format = "[ $symbol($version) ]($style)"

[python]
symbol = "Py "
style = "bg:#000000 fg:#FFFF00 bold"
format = "[ $symbol($version) ]($style)"

# Komut Süresi (Sarı arka plan, siyah yazı)
[cmd_duration]
min_time = 500
style = "bg:#FFFF00 fg:#000000 bold"
format = "[ ⏱ $duration ]($style)"

# Saat (Beyaz arka plan, siyah yazı)
[time]
disabled = false
time_format = "%R"
style = "bg:#FFFFFF fg:#000000 bold"
format = "[ 🕒 $time ]($style)"

# Komut Satırı Simgesi
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
